import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.gradle.api.JavaVersion
import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
	id 'java'
	id 'application'
	id 'org.jetbrains.kotlin.jvm' version '1.9.23'
	id 'org.openjfx.javafxplugin' version '0.1.0'
	id 'com.gluonhq.gluonfx-gradle-plugin' version '1.0.26'
}

group = 'ru.ravel'
version = '0.6.1'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.23'
	implementation 'net.sf.saxon:Saxon-HE:12.3'

	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.0'
	implementation 'org.ccil.cowan.tagsoup:tagsoup:1.2.1'

	implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.0'
	implementation 'org.kordamp.ikonli:ikonli-fontawesome5-pack:12.3.0'
	implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.0'

	implementation 'org.fxmisc.richtext:richtextfx:0.11.5'
	implementation 'org.apache.commons:commons-text:1.14.0'

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

kotlin {
	jvmToolchain {
		languageVersion.set(JavaLanguageVersion.of(17))
	}
}

javafx {
	version = '21'
	modules = ['javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml']
}

application {
	mainClass = 'ru.ravel.xsltsandbox.XmlXsltValidatorAppKt'
	applicationName = 'XSLTSandbox'
}

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = '17'
		languageVersion = '1.9'
	}
}

test {
	useJUnitPlatform()
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes('Main-Class': 'ru.ravel.xsltsandbox.XmlXsltValidatorAppKt')
	}
}

sourceSets {
	main {
		resources {
			srcDirs = ['src/main/resources', 'src/resources']
		}
	}
}

tasks.named('processResources', Copy) {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/*
 * jpackage packaging for the non-modular application.
 * This deliberately does not use org.beryx.jlink/runtime: jpackage builds
 * the application image and its private Java runtime itself.
 */
def jpackageInputDir = layout.buildDirectory.dir('jpackage/input')
def jpackageOutputDir = layout.buildDirectory.dir('installer')
def winIcon = file('src/main/resources/icons/XSLTSandbox.ico')

def jpackageExecutableProvider = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(17)
}.map { launcher ->
	def ext = System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : ''
	new File(launcher.metadata.installationPath.asFile, "bin/jpackage${ext}")
}

tasks.register('prepareJpackageInput', Copy) {
	dependsOn tasks.named('jar')

	into(jpackageInputDir)
	from(tasks.named('jar'))
	from(configurations.runtimeClasspath)

	doFirst {
		delete(jpackageInputDir.get().asFile)
	}
}

tasks.register('jpackageImage', Exec) {
	group = 'distribution'
	description = 'Builds a portable Windows app-image with a bundled JVM.'
	dependsOn tasks.named('prepareJpackageInput')

	doFirst {
		def outputDir = jpackageOutputDir.get().asFile
		def imageDir = new File(outputDir, 'XSLTSandbox')
		delete(imageDir)
		outputDir.mkdirs()

		def jpArgs = [
			'--type', 'app-image',
			'--name', 'XSLTSandbox',
			'--dest', outputDir.absolutePath,
			'--input', jpackageInputDir.get().asFile.absolutePath,
			'--main-jar', tasks.named('jar').get().archiveFileName.get(),
			'--main-class', 'ru.ravel.xsltsandbox.XmlXsltValidatorAppKt',
			'--app-version', project.version.toString()
		]

		if (winIcon.exists()) {
			jpArgs += ['--icon', winIcon.absolutePath]
		} else {
			logger.warn("jpackage icon not found: ${winIcon.absolutePath}")
		}

		executable(jpackageExecutableProvider.get().absolutePath)
		args(jpArgs)
	}
}

// Diagnostic variant. It creates a separate app image with a console so that
// startup exceptions are visible instead of only the generic Windows dialog.
tasks.register('jpackageImageDebug', Exec) {
	group = 'distribution'
	description = 'Builds a diagnostic portable app-image with Windows console enabled.'
	dependsOn tasks.named('prepareJpackageInput')

	doFirst {
		def outputDir = layout.buildDirectory.dir('installer-debug').get().asFile
		def imageDir = new File(outputDir, 'XSLTSandboxDebug')
		delete(imageDir)
		outputDir.mkdirs()

		def jpArgs = [
			'--type', 'app-image',
			'--name', 'XSLTSandboxDebug',
			'--dest', outputDir.absolutePath,
			'--input', jpackageInputDir.get().asFile.absolutePath,
			'--main-jar', tasks.named('jar').get().archiveFileName.get(),
			'--main-class', 'ru.ravel.xsltsandbox.XmlXsltValidatorAppKt',
			'--app-version', project.version.toString(),
			'--win-console'
		]

		if (winIcon.exists()) {
			jpArgs += ['--icon', winIcon.absolutePath]
		}

		executable(jpackageExecutableProvider.get().absolutePath)
		args(jpArgs)
	}
}

gluonfx {
	graalvmHome = 'C:/Program Files/Java/graalvm-jdk-24.0.1+9.1'
	javaStaticSdkVersion = '24-2'
	javafxStaticSdkVersion = '24-ea+7.1'
	target = 'host'
	mainClassName = 'ru.ravel.xsltsandbox.XmlXsltValidatorAppKt'
	verbose = true
	enableSwRendering = false
	runtimeArgs = [
		"-agentlib:native-image-agent=config-output-dir=${buildDir}/agent-output"
	]
}
